# Based on Reloaded mod loader's build script

name: Build new Release

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  RELEASE_TAG: ${{ github.ref_name }}

  PUBLISH_PATH: ./Publish
  CHANGELOG_PATH: CHANGELOG.md
  NUGET_URL: https://api.nuget.org/v3/index.json

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Setup .NET Core 9.0
      uses: actions/setup-dotnet@v1.8.2
      with:
        dotnet-version: 9.0.x

    - name: Build
      run: ./Build.ps1 -PublishPath ${{ env.PUBLISH_PATH }}
    
    - name: Upload GitHub Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHub Release
        path: |
          ${{ env.PUBLISH_PATH }}/Github/*

    - name: Upload NuGet Release Artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: NuGet Release
        # A file, directory or wildcard pattern that describes what to upload
        path: |
          ${{ env.PUBLISH_PATH }}/Nuget/*

    - name: Upload to GitHub Releases (on Tag)
      uses: softprops/action-gh-release@v0.1.14
      if: env.IS_RELEASE == 'true'
      with:
        body_path: ${{ env.CHANGELOG_PATH }}
        files: |
          ${{ env.PUBLISH_PATH }}/Github/*

    - name: Login to NuGet (on Tag)
      uses: NuGet/login@v1
      if: env.IS_RELEASE == 'true'
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet (on Tag)
      if: env.IS_RELEASE == 'true'
      run: |
        if ([string]::IsNullOrEmpty("${{ steps.login.outputs.NUGET_API_KEY }}"))
        {
            Write-Host "Could not retrieve the NuGuet key, skipping."
            return
        }
        $items = Get-ChildItem -Path "${{ env.PUBLISH_PATH }}/Nuget/*.nupkg"
        Foreach ($item in $items)
        {
            Write-Host "Pushing $item"
            dotnet nuget push "$item" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s "${{ env.NUGET_URL }}" --skip-duplicate
        }